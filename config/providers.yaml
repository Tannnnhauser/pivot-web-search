# Pivot Web Search — Provider Configuration
#
# Providers are tried by priority (lower number = tried first).
# Same-priority providers are hedged (queried concurrently, first quality result wins).
# If no priority is set, smart defaults apply based on provider type:
#   llm_search = 10, tavily/brave = 20, searxng/json_api = 30, gemini = 40, ddg = 90
#
# Fields:
#   name        (required) Unique identifier
#   type        (required) Adapter type: ddg, tavily, brave, gemini, searxng, json_api, llm_search
#   enabled     (optional) Default: true
#   priority    (optional) Lower = higher priority. Omit to use smart default.
#   timeout     (optional) Per-provider timeout in seconds. Type-based defaults apply.
#   affinity    (optional) "general" (default) or "deep" (only used on explicit deep request)
#   api_key_env (optional) Environment variable holding the API key

providers:
  - name: tavily
    type: tavily
    api_key_env: TAVILY_API_KEY
    # priority: 20 (smart default — hedged with brave)
    # timeout: 4 (smart default)

  - name: brave
    type: brave
    api_key_env: BRAVE_API_KEY
    # priority: 20 (smart default — hedged with tavily)
    # timeout: 4 (smart default)

  - name: gemini
    type: gemini
    api_key_env: GEMINI_SEARCH_API_KEY
    model: gemini-2.5-flash
    # priority: 40 (smart default)
    # timeout: 20 (smart default)

  - name: ddg
    type: ddg
    # priority: 90 (smart default — exhaustion fallback)
    # timeout: 6 (smart default)

