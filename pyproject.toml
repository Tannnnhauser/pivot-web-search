[project]
name = "pivot-web-search-workspace"
version = "0.0.0"
description = "Development workspace for the pivot-web-search Claude Code plugin"
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["plugins/pivot-web-search"]

[tool.uv.sources]
pivot-web-search-mcp = { workspace = true }

[project.optional-dependencies]
browser = ["pivot-web-search-mcp[browser]"]

[dependency-groups]
dev = [
    "pivot-web-search-mcp",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests requiring real API keys or network access"]
filterwarnings = [
    # opentelemetry (transitive) uses a stdlib API that 3.12+ marks deprecated.
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", "plugins/*/.venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pivot_web_search_mcp"]
