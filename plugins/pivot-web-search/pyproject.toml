[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pivot-web-search-mcp"
version = "1.1.0"
description = "Pivot Web Search — Claude Code plugin: multi-provider web search with failover"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["mcp", "search", "web", "claude", "plugin"]
authors = [{name = "Patrick Lu"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.0,<4.0",
    "ddgs>=7.0,<10.0",
    "trafilatura>=2.0,<3.0",
    "certifi>=2024.1.0",
    "pyyaml>=6.0,<7.0",
    "filelock>=3.12,<4.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40,<2.0",
]

[project.scripts]
pivot-web-search = "pivot_web_search_mcp.cli:main"
pivot-web-search-bridge = "pivot_web_search_mcp.machine_bridge:main"
pivot-web-search-mcp = "pivot_web_search_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Tannnnhauser/pivot-web-search"
Repository = "https://github.com/Tannnnhauser/pivot-web-search"
Issues = "https://github.com/Tannnnhauser/pivot-web-search/issues"
